; PlatformIO Project Configuration File
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; dashboard copies each line to the live dashboard (dashboard/) over UDP;
; harmless when it is not running
monitor_filters = default, dashboard
upload_speed = 921600
build_flags =
    -DFASTLED_INTERNAL
    ; a status line at least every 750 ms so the dashboard's meters keep moving
    -DSTORM_LOG_STATS=750
; FastLED for the colour math only, pinned because the bench transcribes it
; bit for bit. Adafruit NeoPixel drives the strip: see src/strip.h for why.
lib_deps =
    fastled/FastLED @ 3.10.3
    adafruit/Adafruit NeoPixel @ ^1.12.0
